[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosfire"
version = "0.1.0"
description = "COSFIRE (Combination of Shifted Filter Responses) trainable filters for keypoint detection and pattern recognition."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Manuel Castejón Limas", email = "mcasl@unileon.es" }]
keywords = ["COSFIRE", "computer vision", "keypoint detection", "pattern recognition"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "peakutils>=1.3.4",
]

[project.urls]
Repository = "https://github.com/mcasl/COSFIRE"

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.7",
    "ruff>=0.6",
]
docs = [
    "sphinx",
    "sphinx-gallery",
    "sphinx_rtd_theme",
    "numpydoc",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["cosfire"]
exclude = ["cosfire/v0", "cosfire/tests"]

[tool.hatch.build.targets.sdist]
include = ["cosfire", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["cosfire/v0"]

[tool.pytest.ini_options]
testpaths = ["cosfire/tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["cosfire/v0", "doc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
