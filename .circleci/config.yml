# CircleCI configuration: tests and documentation, managed with uv.
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2
jobs:
  build:

    docker:
      - image: ghcr.io/astral-sh/uv:python3.14-bookworm
        environment:
        - USERNAME: "COSFIRE"
        - DOC_REPO: "COSFIRE"
        - DOC_URL: ""
        - EMAIL: "cosfire.project@gmail.com"
        - UV_LINK_MODE: copy

    working_directory: ~/COSFIRE

    branches:
      ignore:
        - gh-pages

    steps:

      - add_ssh_keys:
          fingerprints:
          - "61:7c:f5:37:a8:8d:61:c0:ca:fb:23:3a:7a:d7:06:c2"

      - checkout

      - restore_cache:
          keys:
          - v2-uv-{{ checksum "uv.lock" }}
          # fallback to using the latest cache if no exact match is found
          - v2-uv-

      - run:
          name: Install dependencies
          command: uv sync --locked --group docs

      - save_cache:
          paths:
            - ~/.cache/uv
          key: v2-uv-{{ checksum "uv.lock" }}

      - run:
          name: Run tests
          command: |
            mkdir test-reports
            uv run --locked pytest --junitxml=test-reports/junit.xml

      - store_test_results:
            path: test-reports

      - store_artifacts:
            path: test-reports

      - run:
          name: Make HTML documentation
          command: |
            set -o pipefail && uv run --locked make -C doc html 2>&1 | tee ~/log.txt
            if grep -q "Traceback (most recent call last):" ~/log.txt; then false; else true; fi

      - deploy:
          name: Push Documentation to Github Pages
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
                ci_scripts/circleci/push_doc.sh doc/_build/html
            fi

      - store_artifacts:
          path: doc/_build/html
          destination: html
